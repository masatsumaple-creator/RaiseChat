name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # ドラフトPRはスキップ(ready_for_review で実行される)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストを日本語でレビューしてください。
            観点: バグ・ロジックの誤り、セキュリティ、可読性・保守性、テスト不足。
            - 問題のある行にはインラインコメントを付けてください。
            - 最後に全体のサマリを1つのコメントでまとめてください。
            - 指摘は重要度の高いものに絞り、スタイルだけの細かい指摘は避けてください。
            - 問題がなければ、その旨を簡潔に伝えてください。
            コードの変更や push は行わないでください。
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
