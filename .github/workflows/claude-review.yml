name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # ドラフトPRはスキップ(ready_for_review で実行される)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストをレビューしてください。観点や方針は CLAUDE.md に従ってください。
            - 問題のある行にはインラインコメントを付けてください。
            - 最後に全体のサマリを1つのコメントでまとめてください。
            コードの変更や push は行わないでください。

            重要度の付け方(CLAUDE.md の「レビュー指摘の重要度」に従う):
            - すべての指摘(インラインコメントとサマリ内の指摘)の先頭に、[重要] か [軽微] を付けてください。
            - [重要]: 放置すると、バグ、セキュリティ上の問題、データの破損や消失、重要なロジックのテスト不足、
              実装者が誤って実装しかねない仕様の矛盾や抜け、のいずれかになるもの。
            - [軽微]: 上記に当たらないもの(表現・命名・任意の補足・起こりにくい仮定の話・好みの改善)。
              迷ったら [軽微] にしてください。
            - このプルリクエストで、すでに指摘され、その後のコミットで直されている内容は、再び指摘しないでください。
              再レビューのときは、前回の指摘が直っているかを確認し、直っていなければ、そのことを書いてください。
            - サマリの最後の行に、次のどちらかを、そのままの形で書いてください。
              判定: 重要な指摘なし
              判定: 重要な指摘 N 件(N は [重要] の件数)
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
